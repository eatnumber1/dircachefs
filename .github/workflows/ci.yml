# CI: the whole test suite, in three jobs of increasing size (the tiers of
# test/qemu/README.md) and two sanitizer suites (`asan`, `ubsan`) that run in
# parallel with the last tier, `full`; those three jobs are matrices of three
# shards each (.github/ci/test.sh --shard=I/3). Every dcfs test, unit tests included,
# boots the project's own kernel under QEMU as root; KVM is used when the runner has
# it (public repositories' standard Linux runners do) and TCG otherwise
# (.github/ci/prepare.sh, .github/ci/test.sh). Bazel builds everything the
# tests need: the kernel, QEMU, busybox, the mkfs tools and the Debian image.
#
# Developed with nektos/act before publication: see "CI" in README.md and
# third_party/act/README.md (`bazel run //third_party/act -- -j fast`).
#
# Kernel matrix: not yet. The tests boot Alpine's linux-virt of the one
# pinned branch (//third_party/linux:vmlinuz, series 6.18 on v3.24, fetched
# fresh on each run so the branch's current build is what is tested); testing
# the minimum supported kernel (6.9, README.md) as well needs a second
# kernel, and a Bazel flag selecting it in the qemu_test macros. See
# "Kernel matrix" in third_party/linux/README.md.
#
# Caches: the disk cache is content addressed, so a pin change invalidates
# only the actions whose inputs changed; the cache keys therefore end in the
# commit and restore the newest entry of the same job ("restore-keys"), and
# the cache is saved even when tests fail (the kernel build takes half an
# hour). A job with no cache of its own starts from the newest cache of any
# job ("bazel-"), so presubmit and full start from what fast built.
#
# Quota: per commit the fast, presubmit and full jobs each save a disk cache of
# up to 4 GB (12 GB at most; the coverage and reproducible jobs save none: the
# instrumented build's actions are its own), and the repository cache (the
# downloaded archives, a few GB, without the 12 GB of extracted repositories
# that prepare.sh puts in an unsaved directory) is saved once per lock-file
# change. GitHub evicts the oldest entries beyond 10 GB.
#
# The repository cache (downloaded archives: the 1.9 GB LLVM tarball, Alpine
# packages, the kernel sources) is a cache of its own, keyed by
# MODULE.bazel.lock alone and saved only on a key miss: GitHub keeps 10 GB per
# repository, and saving it with the per-commit disk cache would store a copy
# of the archives for every commit. A lock-file change misses once, restores
# the newest older copy (restore-keys) and saves the new one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cold:
        description: >-
          Run every job with no cache restored and none saved: the cold path
          (an evicted cache, a changed lock file), to check the timeouts.
        type: boolean
        default: false
  # The schedule exists only for what changes without a commit: OSV
  # advisories. The test jobs are skipped on it.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  subjects:
    # Step 26.13: every commit subject of the range starts with a plan step.
    # A job of its own, seconds, no cache: a bad subject fails the run's
    # status but gates no test job (nothing `needs` it). The rule stays strict;
    # the orchestrator checks branches before merging.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the commit range below needs the history
      - name: Commit subjects start with a plan step
        run: >-
          ./.github/ci/commit_subjects.sh
          "${{ github.event_name == 'pull_request'
          && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
          || format('{0}..{1}', github.event.before, github.sha) }}"

  fast:
    if: ${{ github.event_name != 'schedule' }}
    # Small tests: `bazel test --config=fast //...` (about a minute with KVM, once built).
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07, measured here under load 18 on 4 cores: fetch of every repository with empty caches 24 min, our C++ build about 20 min, tests 3 min: about 50 min)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-fast-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-fast-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-fast-
            bazel-
      - name: Test
        run: ./.github/ci/test.sh --config=fast
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-fast
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && inputs.cold != true && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  presubmit:
    # Small and medium tests.
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07: fetch 24 min + build 20 min + small and medium tests about 30 min: about 75 min)
    timeout-minutes: 150
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-presubmit-
            bazel-
      - name: Test
        run: ./.github/ci/test.sh --config=presubmit
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-presubmit
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && inputs.cold != true && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  coverage:
    # Source-based coverage of our code over the small and medium tests (step
    # 7.2): the combined lcov report is an artifact. No threshold gate yet.
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07: fetch 24 min + instrumented build and the small and medium tests about 50 min (a coverage run took 37 min with warm externals): about 75 min)
    timeout-minutes: 150
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      # Restore only: the instrumented build's actions are its own, so the
      # job saves nothing (four jobs saving up to 4 GB each per commit do not
      # fit GitHub's 10 GB quota); it starts from presubmit's tools and
      # externals and compiles our code again.
      - name: Restore Bazel caches (presubmit's, read-only)
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-presubmit-restore-only-${{ github.sha }}
          restore-keys: |
            bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-presubmit-
            bazel-
      - name: Test
        run: ./.github/ci/coverage.sh --config=presubmit
      - name: Upload the lcov report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: ci-coverage
          if-no-files-found: ignore
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-coverage
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}

  reproducible:
    # Step 26.12: two builds of main_static and dcfs.8 from two copies of the
    # repository at different paths, in two output bases, with no disk cache,
    # must be byte-identical (tools/reproducible_build.sh). Two cold builds, so
    # only the repository cache helps.
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07: fetch 24 min, two cold builds of 6 to 12 min, and the second build's own contents cache (a second 13 GB extraction, about 10 min): about 60 min)
    timeout-minutes: 120
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Reproducible build
        run: bazel run //tools:reproducible_build
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}

  mutation-changed:
    # Step 26.5b, the per-push bumper: only the functions of
    # tools/mutation/scope.txt whose lines the range touches, at most 30
    # mutants (a sample with a fixed seed beyond that); a mutant that survives
    # the small tier and trace validation fails the job: the change needs a
    # test. Survivors elsewhere are the weekly job's (mutation.yml). A job of
    # its own, once per push: not inside the shards of `full`. It saves no
    # cache (the mutants' compiles are one-off): the repository cache and
    # presubmit's disk cache are only restored.
    if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07: fetch 24 min + build 15 min, then up to 30 mutants of 1.5 min (killed by the small tier) to 11 min (survivors): 40 min + a bound of about 2 h, the usual push touches a handful of functions)
    timeout-minutes: 180
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the commit range needs the history
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches (presubmit's, read-only)
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-mutation-changed-restore-only-${{ github.sha }}
          restore-keys: |
            bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-presubmit-
            bazel-
      - name: Mutation testing of the protocol code this push touched
        run: >
          python3 tools/mutation/mutate.py changed
          --range "${{ github.event_name == 'pull_request'
          && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
          || format('{0}..{1}', github.event.before, github.sha) }}"
          --result mutation-changed.json
          --survivors-out mutation-changed-survivors.txt
          --fail-on-survivor
      - name: Upload the mutation survivors
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-changed
          path: |
            mutation-changed.json
            mutation-changed-survivors.txt
          if-no-files-found: ignore

  full:
    # The large and enormous tiers (small and medium ran in `presubmit`), in three shards
    # (.github/ci/test.sh --shard=I/3: a deterministic partition of the suite's
    # test targets; the jobs run in parallel with each other and with the
    # other suites).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # Limit = 2x the cold estimate (the cold part is measured: fetch 24 min + build 20 min = 45 min; the tests are the serial sum of the shard's measured times (46, 52 and 55 min) divided by 1.5 for two guests at a time: 31-37 min, 80 min in all, step 11.2's ACE targets included; a `cold` run has not measured a shard)
    timeout-minutes: 180
    needs: presubmit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-full-${{ matrix.shard }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-full-${{ matrix.shard }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-full-${{ matrix.shard }}-
            bazel-full-
            bazel-
      - name: Test (shard ${{ matrix.shard }} of 3)
        run: ./.github/ci/test.sh --sizes=large,enormous --shard=${{ matrix.shard }}/3
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-full-${{ matrix.shard }}
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && inputs.cold != true && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  asan:
    # Every tier under AddressSanitizer, in three shards
    # (.github/ci/test.sh --shard=I/3: a deterministic partition of the suite's
    # test targets; the jobs run in parallel with each other and with the
    # other suites).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # Limit = 1.5x the estimate (2026-10-08: the cold part is fetch 24 min + build 20 min = 45 min, measured; the tests are the serial sum of the shard's measured plain times (61, 62 and 46 min) times 2.5 to 3 for ASan, except step 11.2's ACE and kill tests, which measured the same under ASan as plain (fault_ace_fs_test_xfs 227 s under ASan, 199-247 s plain: their time is VM boots and mounts, not dcfs), divided by 1.5 for two guests at a time: 89-105, 96-114 and 71-84 min, so 116-159 min with the cold part; the limit keeps the margin of a noisy runner)
    timeout-minutes: 240
    needs: presubmit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-asan-${{ matrix.shard }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-asan-${{ matrix.shard }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-asan-${{ matrix.shard }}-
            bazel-asan-
            bazel-
      - name: Test (shard ${{ matrix.shard }} of 3)
        run: ./.github/ci/test.sh --config=asan --shard=${{ matrix.shard }}/3
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-asan-${{ matrix.shard }}
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && inputs.cold != true && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  ubsan:
    # Every tier under UndefinedBehaviorSanitizer, in three shards
    # (.github/ci/test.sh --shard=I/3: a deterministic partition of the suite's
    # test targets; the jobs run in parallel with each other and with the
    # other suites).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # Limit = 1.7x the estimate (cold part fetch 24 min + build 20 min = 45 min, measured; the tests about 1.5 times the plain serial sums, 61, 62 and 46 min, divided by 1.5: 60 min; 105 min in all)
    timeout-minutes: 180
    needs: presubmit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-ubsan-${{ matrix.shard }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-ubsan-${{ matrix.shard }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-ubsan-${{ matrix.shard }}-
            bazel-ubsan-
            bazel-
      - name: Test (shard ${{ matrix.shard }} of 3)
        run: ./.github/ci/test.sh --config=ubsan --shard=${{ matrix.shard }}/3
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-ubsan-${{ matrix.shard }}
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && inputs.cold != true && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  osv:
    # Dependency vulnerability scan (plan step 5.3; tools/sbom/README.md and
    # README.md "Dependency vulnerability scanning"). Only what the dcfs
    # binaries link (the shipped SBOM) gates: each shipped project is scanned
    # by its upstream git commit, the form OSV matches C/C++ projects by.
    # The test-only pins (Debian image, kernel, QEMU, busybox, ...) are
    # scanned informationally and never fail the job. The scanner version is
    # the one of the action pinned below (its image,
    # ghcr.io/google/osv-scanner-action:v2.6.0). Fails on any shipped finding
    # that osv-scanner.toml does not ignore, and on an expired ignore.
    #
    # The repository cache (what the test jobs download: the Alpine packages
    # among them) is restored read-only, like theirs but never saved from
    # here: a cold runner fetches the five Alpine repositories in about a
    # minute (measured with empty output base and caches, 2026-10-08: fetch
    # 63 s, cquery 3 s; this sequence does not fetch the C++ toolchain), but
    # the limit is 45 minutes for what a slow mirror costs (a run was
    # cancelled at the former 20).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (Bazelisk, which fetches the Alpine packages)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache (read-only)
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Check ignores and pinned commits, generate the SBOMs and git roots
        run: ./.github/ci/osv.sh
      - name: Scanner self-check (libfuse 3.2.0 must be found, CVE-2018-10906)
        id: seeded
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan
            source
            --include-git-root
            --no-ignore
            -r
            osv/seeded-git
      - name: The self-check found something
        run: |
          test "${{ steps.seeded.outcome }}" = failure || {
            echo "scanner reported nothing for libfuse 3.2.0 (a known-vulnerable commit): the shipped scan is vacuous" >&2
            exit 1
          }
      - name: Scan the shipped dependencies (gates)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan
            source
            --config=osv-scanner.toml
            --include-git-root
            --no-ignore
            -r
            osv/shipped-git
      - name: Scan the shipped Debian packages (informational for now)
        # glibc, linked statically from the toolchain's sysroot: OSV matches
        # Debian packages by name and version, not by commit. Not gating yet:
        # Debian 12's glibc 2.36-9+deb12u14 has 16 unfixed OSV records (one
        # of them DEBIAN-CVE-2026-5450, CVSS 9.8; docs/plan/notes/
        # osv-scan-2026-10-07.txt) and osv-scanner.toml ignores none, so the
        # step would fail on its first run. Whether to ignore them with a
        # reason and an expiry, or to build against a glibc with the fixes, is
        # russ's decision (7.1b); until then the job stays informative and
        # green. Remove continue-on-error once it is made.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan
            source
            --config=osv-scanner.toml
            -L
            osv/shipped-debs.cdx.json
      - name: Scan the test-only dependencies (informational, never fails)
        id: testonly
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan
            source
            -L
            osv/testonly.cdx.json
      - name: Test-only scan result
        run: |
          if test "${{ steps.testonly.outcome }}" = success; then
            echo "test-only dependencies: no findings (informational)"
          else
            echo "test-only dependencies: findings listed in the step above (informational, not gating)"
          fi
