# QEMU end-to-end tests (--config=qemu, tag qemu) are excluded by the default
# test_tag_filters in .bazelrc and will be enabled here once the kernel under
# test is pinnable (see the plan's step 5.4).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev attr
      - run: bazel test //...
      - run: bazel test --config=asan //...
