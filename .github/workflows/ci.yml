# CI: the whole test suite, in three jobs of increasing size (the tiers of
# test/qemu/README.md) and two sanitizer suites (`asan`, `ubsan`) that run in
# parallel with the last tier, `full`; those three jobs are matrices of three
# shards each (.github/ci/test.sh --shard=I/3). The xfstests generic tests
# (step 17.1) are a job of their own, `xfstests`, one runner per backing file
# system, and are left out of those three. Every dcfs test, unit tests included,
# boots the project's own kernel under QEMU as root; KVM is used when the runner has
# it (public repositories' standard Linux runners do) and TCG otherwise
# (.github/ci/prepare.sh, .github/ci/test.sh). Bazel builds everything the
# tests need: the kernel, QEMU, busybox, the mkfs tools and the Debian image.
#
# Profiles (step 26.16): every job that runs Bazel writes its JSON trace profile
# (DCFS_CI_PROFILE, set per job below) and uploads it as the artifact
# `bazel-profile-<job>[-<shard>]`; .github/ci/profile.sh puts the table of
# tools/ci_profile.py (fetch, @dcfs_llvm, third-party builds, our build, tests,
# critical path) in the job summary.
#
# Developed with nektos/act before publication: see "CI" in README.md and
# third_party/act/README.md (`bazel run //third_party/act -- -j fast`).
#
# Kernel matrix: not yet. The tests boot Alpine's linux-virt of the one
# pinned branch (//third_party/linux:vmlinuz, series 6.18 on v3.24, fetched
# fresh on each run so the branch's current build is what is tested); testing
# the minimum supported kernel (6.9, README.md) as well needs a second
# kernel, and a Bazel flag selecting it in the qemu_test macros. See
# "Kernel matrix" in third_party/linux/README.md.
#
# Caches: the disk cache is content addressed, so a pin change invalidates
# only the actions whose inputs changed; the cache keys therefore end in the
# commit and restore the newest entry of the same job ("restore-keys"), and
# the cache is saved even when tests fail (the kernel build takes half an
# hour). A job with no cache of its own starts from the newest cache of any
# job ("bazel-"), so presubmit and full start from what fast built.
#
# Quota: per commit the fast, presubmit and full jobs each save a disk cache of
# up to 4 GB (12 GB at most; the coverage and reproducible jobs save none: the
# instrumented build's actions are its own), and the repository cache (the
# downloaded archives, a few GB, without the 12 GB of extracted repositories
# that prepare.sh puts in an unsaved directory) is saved once per lock-file
# change. GitHub evicts the oldest entries beyond 10 GB.
#
# The repository cache (downloaded archives: the 1.9 GB LLVM tarball, Alpine
# packages, the kernel sources) is a cache of its own, keyed by
# MODULE.bazel.lock alone and saved only on a key miss: GitHub keeps 10 GB per
# repository, and saving it with the per-commit disk cache would store a copy
# of the archives for every commit. A lock-file change misses once, restores
# the newest older copy (restore-keys) and saves the new one.
#
# The extracted toolchain (step 26.16b): unpacking @dcfs_llvm took 3 to 8
# minutes in every Bazel job of run 37973594236 (fast 199 s, presubmit 456 s,
# coverage 263 s, about 250 s in each shard's `cquery`, 9 shards; see
# docs/plan/notes/ci-profile-2026-10-09.md). Bazel's repo contents cache
# cannot hold it (only http_archive repositories become entries there), so the
# jobs cache the output base's external/+llvm_distribution+dcfs_llvm and its
# marker, which prepare.sh locates (DCFS_BAZEL_EXTERNAL; the output base is
# named by the workspace path, the same on every GitHub runner). Bazel reuses
# a restored directory only when the marker's recorded inputs match, so a
# stale entry costs a refetch, never a wrong build. 2.1 GB on disk, 0.58 GB
# compressed (zstd -3, measured): one entry per key, shared by all jobs, of
# the 10 GB quota. The key is the hash of MODULE.bazel, its lock,
# .bazelversion and third_party/llvm/*, no restore-keys (an older entry never
# matches); saved on a miss only; `cold` neither restores nor saves, so it
# still extracts. `reproducible` (two builds in output bases of their own)
# and `osv` do not use it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      noisy:
        description: >-
          Also run the `noisy` job (step 26.14e), which a schedule always
          runs: the suite with the quiet kernel's sysctls at the kernel's
          defaults and two vCPUs per guest, three runs of each small and
          medium test. About two hours on six runners.
        type: boolean
        default: false
      cold:
        description: >-
          Run every job with no cache restored and none saved: the cold path
          (an evicted cache, a changed lock file), to check the timeouts and
          read the profile tables. Nothing is saved because the caches are
          content addressed and keyed by commit: skipping the save leaves the
          warm entries and the 10 GB quota as they were, and the next warm
          run restores them unchanged (a save would only add a copy).
        type: boolean
        default: false
  # The schedule exists only for what changes without a commit: OSV
  # advisories, and the noisy run (step 26.14e: a weekly search for races, which
  # needs no commit either). The push gate's test jobs are skipped on it.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  subjects:
    # Step 26.13: every commit subject of the range starts with a plan step.
    # A job of its own, seconds, no cache: a bad subject fails the run's
    # status but gates no test job (nothing `needs` it). The rule stays strict;
    # the orchestrator checks branches before merging.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the commit range below needs the history
      - name: Commit subjects start with a plan step
        run: >-
          ./.github/ci/commit_subjects.sh
          "${{ github.event_name == 'pull_request'
          && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
          || format('{0}..{1}', github.event.before, github.sha) }}"

  fast:
    if: ${{ github.event_name != 'schedule' }}
    # Small tests: `bazel test --config=fast //...` (about a minute with KVM, once built).
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07, measured here under load 18 on 4 cores: fetch of every repository with empty caches 24 min, our C++ build about 20 min, tests 3 min: about 50 min)
    timeout-minutes: 120
    env:
      # Step 26.16: where Bazel writes its profile (test.sh, coverage.sh,
      # tools/reproducible_build.sh); the steps below summarize and upload it.
      DCFS_CI_PROFILE: ${{ github.workspace }}/ci-profile/fast.json.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      # Step 26.16b: the extracted @dcfs_llvm (see the top of this file).
      - name: Restore the extracted LLVM toolchain
        id: llvmcache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DCFS_BAZEL_EXTERNAL }}/+llvm_distribution+dcfs_llvm
            ${{ env.DCFS_BAZEL_EXTERNAL }}/@+llvm_distribution+dcfs_llvm.marker
          key: bazel-llvm-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'third_party/llvm/*') }}
      - name: Restore Bazel caches
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-fast-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-fast-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-fast-
            bazel-
      - name: Test
        run: ./.github/ci/test.sh --config=fast
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Where the time went (job summary)
        if: ${{ !cancelled() }}
        run: ./.github/ci/profile.sh
      - name: Upload the Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-profile-fast
          path: ci-profile
          if-no-files-found: ignore
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-fast
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save the extracted LLVM toolchain
        if: ${{ !cancelled() && inputs.cold != true && steps.llvmcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DCFS_BAZEL_EXTERNAL }}/+llvm_distribution+dcfs_llvm
            ${{ env.DCFS_BAZEL_EXTERNAL }}/@+llvm_distribution+dcfs_llvm.marker
          key: ${{ steps.llvmcache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && inputs.cold != true && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  presubmit:
    # Small and medium tests.
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07: fetch 24 min + build 20 min + small and medium tests about 30 min: about 75 min)
    timeout-minutes: 150
    env:
      # Step 26.16: where Bazel writes its profile (test.sh, coverage.sh,
      # tools/reproducible_build.sh); the steps below summarize and upload it.
      DCFS_CI_PROFILE: ${{ github.workspace }}/ci-profile/presubmit.json.gz
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      # Step 26.16b: the extracted @dcfs_llvm (see the top of this file).
      - name: Restore the extracted LLVM toolchain
        id: llvmcache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DCFS_BAZEL_EXTERNAL }}/+llvm_distribution+dcfs_llvm
            ${{ env.DCFS_BAZEL_EXTERNAL }}/@+llvm_distribution+dcfs_llvm.marker
          key: bazel-llvm-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'third_party/llvm/*') }}
      - name: Restore Bazel caches
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-presubmit-
            bazel-
      - name: Test
        run: ./.github/ci/test.sh --config=presubmit
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Where the time went (job summary)
        if: ${{ !cancelled() }}
        run: ./.github/ci/profile.sh
      - name: Upload the Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-profile-presubmit
          path: ci-profile
          if-no-files-found: ignore
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-presubmit
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save the extracted LLVM toolchain
        if: ${{ !cancelled() && inputs.cold != true && steps.llvmcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DCFS_BAZEL_EXTERNAL }}/+llvm_distribution+dcfs_llvm
            ${{ env.DCFS_BAZEL_EXTERNAL }}/@+llvm_distribution+dcfs_llvm.marker
          key: ${{ steps.llvmcache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && inputs.cold != true && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  coverage:
    # Source-based coverage of our code over the small and medium tests (step
    # 7.2): the combined lcov report is an artifact. No threshold gate yet.
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07: fetch 24 min + instrumented build and the small and medium tests about 50 min (a coverage run took 37 min with warm externals): about 75 min)
    timeout-minutes: 150
    env:
      # Step 26.16: where Bazel writes its profile (test.sh, coverage.sh,
      # tools/reproducible_build.sh); the steps below summarize and upload it.
      DCFS_CI_PROFILE: ${{ github.workspace }}/ci-profile/coverage.json.gz
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      # Restore only: the instrumented build's actions are its own, so the
      # job saves nothing (four jobs saving up to 4 GB each per commit do not
      # fit GitHub's 10 GB quota); it starts from presubmit's tools and
      # externals and compiles our code again.
      # Step 26.16b: the extracted @dcfs_llvm (see the top of this file).
      - name: Restore the extracted LLVM toolchain
        id: llvmcache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DCFS_BAZEL_EXTERNAL }}/+llvm_distribution+dcfs_llvm
            ${{ env.DCFS_BAZEL_EXTERNAL }}/@+llvm_distribution+dcfs_llvm.marker
          key: bazel-llvm-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'third_party/llvm/*') }}
      - name: Restore Bazel caches (presubmit's, read-only)
        id: cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-presubmit-restore-only-${{ github.sha }}
          restore-keys: |
            bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-presubmit-
            bazel-
      - name: Test
        run: ./.github/ci/coverage.sh --config=presubmit
      - name: Upload the lcov report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: ci-coverage
          if-no-files-found: ignore
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Where the time went (job summary)
        if: ${{ !cancelled() }}
        run: ./.github/ci/profile.sh
      - name: Upload the Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-profile-coverage
          path: ci-profile
          if-no-files-found: ignore
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-coverage
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}

      - name: Save the extracted LLVM toolchain
        if: ${{ !cancelled() && inputs.cold != true && steps.llvmcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DCFS_BAZEL_EXTERNAL }}/+llvm_distribution+dcfs_llvm
            ${{ env.DCFS_BAZEL_EXTERNAL }}/@+llvm_distribution+dcfs_llvm.marker
          key: ${{ steps.llvmcache.outputs.cache-primary-key }}
  reproducible:
    # Step 26.12: two builds of main_static and dcfs.8 from two copies of the
    # repository at different paths, in two output bases, with no disk cache,
    # must be byte-identical (tools/reproducible_build.sh). Two cold builds, so
    # only the repository cache helps.
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07: fetch 24 min, two cold builds of 6 to 12 min, and the second build's own contents cache (a second 13 GB extraction, about 10 min): about 60 min)
    timeout-minutes: 120
    env:
      # Step 26.16: where Bazel writes its profile (test.sh, coverage.sh,
      # tools/reproducible_build.sh); the steps below summarize and upload it.
      DCFS_CI_PROFILE: ${{ github.workspace }}/ci-profile/reproducible.json.gz
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Reproducible build
        run: bazel run //tools:reproducible_build
      - name: Where the time went (job summary)
        if: ${{ !cancelled() }}
        # The job starts no Bazel of its own at the repository root (the
        # builds are inside the script, in two output bases): the host's
        # python3 runs the tool instead of `bazel run`.
        run: ./.github/ci/profile.sh --python3
      - name: Upload the Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-profile-reproducible
          path: ci-profile
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && inputs.cold != true && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}

  mutation-changed:
    # Step 26.5b, the per-push bumper: only the functions of
    # tools/mutation/scope.txt whose lines the range touches, at most 30
    # mutants (a deterministic selection beyond that, 120 minutes of wall
    # clock at most); a mutant that survives the small tier and trace
    # validation is a finding, not a failure (russ, 2026-10-08): the job
    # summary lists the survivors and the artifact holds the results; only a
    # tooling error (exit status 2) fails the job. Survivors elsewhere are the
    # weekly job's (mutation.yml). A second step (step 12.13) does the same
    # for the TLA+ model (formal/*.tla: the definitions the range touches).
    # A job of
    # its own, once per push: not inside the shards of `full`. It saves no
    # cache (the mutants' compiles are one-off): the repository cache and
    # presubmit's disk cache are only restored.
    if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    # Limit = 2x the cold estimate (2026-10-07: fetch 24 min + build 15 min, then up to 30 mutants of 1.5 min (killed by the small tier) to 11 min (survivors): 40 min + a bound of about 2 h, the usual push touches a handful of functions); step 12.13 adds the TLA+ step (45 minutes at most, nothing when formal/ is not touched): 240.
    timeout-minutes: 240
    needs: fast
    env:
      MUTATION_RANGE: ${{ github.event_name == 'pull_request'
        && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
        || format('{0}..{1}', github.event.before, github.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the commit range needs the history
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      # Step 26.16b: the extracted @dcfs_llvm (see the top of this file).
      - name: Restore the extracted LLVM toolchain
        id: llvmcache
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DCFS_BAZEL_EXTERNAL }}/+llvm_distribution+dcfs_llvm
            ${{ env.DCFS_BAZEL_EXTERNAL }}/@+llvm_distribution+dcfs_llvm.marker
          key: bazel-llvm-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'third_party/llvm/*') }}
      - name: Restore Bazel caches (presubmit's, read-only)
        if: ${{ inputs.cold != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-mutation-changed-restore-only-${{ github.sha }}
          restore-keys: |
            bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-presubmit-
            bazel-
      - name: Mutation testing of the protocol code this push touched
        run: >
          python3 tools/mutation/mutate.py changed
          --range "$MUTATION_RANGE"
          --result mutation-changed.json
          --survivors-out mutation-changed-survivors.txt
      - name: Mutation testing of the TLA+ model this push touched
        # Step 12.13: the definitions of formal/*.tla the range touches (none:
        # nothing runs, no Bazel), at most 10 mutants, the small //formal
        # tier only (the medium tier is the weekly job's), 45 minutes.
        # Survivors are findings, as above.
        run: >
          python3 tools/mutation/mutate.py changed --lang tla --tier small
          --range "$MUTATION_RANGE" --max-mutants 10 --time-budget 45
          --result mutation-changed-tla.json
          --survivors-out mutation-changed-tla-survivors.txt
      - name: Put the survivors in the job summary
        if: ${{ !cancelled() }}
        run: |
          for f in mutation-changed.json mutation-changed-tla.json; do
            if [ -f "$f" ]; then
              python3 tools/mutation/mutate.py report "$f" \
                >>"$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload the mutation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-changed
          path: |
            mutation-changed.json
            mutation-changed-survivors.txt
            mutation-changed-tla.json
            mutation-changed-tla-survivors.txt
          if-no-files-found: ignore

  full:
    # The large and enormous tiers (small and medium ran in `presubmit`), in three shards
    # (.github/ci/test.sh --shard=I/3: a deterministic partition of the suite's
    # test targets; the jobs run in parallel with each other and with the
    # other suites).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # Limit = 2x the cold estimate (the cold part is measured: fetch 24 min + build 20 min = 45 min; the tests are the serial sum of the shard's measured times (46, 52 and 55 min) divided by 1.5 for two guests at a time: 31-37 min, 80 min in all, step 11.2's ACE targets included; a `cold` run has not measured a shard)
