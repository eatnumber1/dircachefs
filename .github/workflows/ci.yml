# CI: the whole test suite, in three jobs of increasing size (the tiers of
# test/qemu/README.md). Every dcfs test, unit tests included, boots the
# project's own kernel under QEMU as root; KVM is used when the runner has
# it (public repositories' standard Linux runners do) and TCG otherwise
# (.github/ci/prepare.sh, .github/ci/test.sh). Bazel builds everything the
# tests need: the kernel, QEMU, busybox, the mkfs tools and the Debian image.
#
# Developed with nektos/act before publication: see "CI" in README.md and
# third_party/act/README.md (`bazel run //third_party/act -- -j fast`).
#
# Kernel matrix: not yet. The tests boot Alpine's linux-virt of the one
# pinned branch (//third_party/linux:vmlinuz, series 6.18 on v3.24, fetched
# fresh on each run so the branch's current build is what is tested); testing
# the minimum supported kernel (6.9, README.md) as well needs a second
# kernel, and a Bazel flag selecting it in the qemu_test macros. See
# "Kernel matrix" in third_party/linux/README.md.
#
# Caches: the disk cache is content addressed, so a pin change invalidates
# only the actions whose inputs changed; the cache keys therefore end in the
# commit and restore the newest entry of the same job ("restore-keys"), and
# the cache is saved even when tests fail (the kernel build takes half an
# hour). A job with no cache of its own starts from the newest cache of any
# job ("bazel-"), so presubmit and full start from what fast built.
#
# The repository cache (downloaded archives: the 1.9 GB LLVM tarball, Alpine
# packages, the kernel sources) is a cache of its own, keyed by
# MODULE.bazel.lock alone and saved only on a key miss: GitHub keeps 10 GB per
# repository, and saving it with the per-commit disk cache would store a copy
# of the archives for every commit. A lock-file change misses once, restores
# the newest older copy (restore-keys) and saves the new one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The schedule exists only for what changes without a commit: OSV
  # advisories. The test jobs are skipped on it.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    if: ${{ github.event_name != 'schedule' }}
    # Small tests: `bazel test --config=fast //...` (about a minute with KVM, once built).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the commit range below needs the history
      - name: Commit subjects start with a plan step (step 26.13)
        run: >-
          ./.github/ci/commit_subjects.sh
          "${{ github.event_name == 'pull_request'
          && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
          || format('{0}..{1}', github.event.before, github.sha) }}"
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-fast-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-fast-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-fast-
            bazel-
      - name: Test
        run: ./.github/ci/test.sh --config=fast
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-fast
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  presubmit:
    # Small and medium tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-presubmit-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-presubmit-
            bazel-
      - name: Test
        run: ./.github/ci/test.sh --config=presubmit
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-presubmit
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  coverage:
    # Source-based coverage of our code over the small and medium tests (step
    # 7.2): the combined lcov report is an artifact. No threshold gate yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-coverage-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-coverage-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-coverage-
            bazel-
      - name: Test
        run: ./.github/ci/coverage.sh --config=presubmit
      - name: Upload the lcov report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: ci-coverage
          if-no-files-found: ignore
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-coverage
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  full:
    # Every test, then every test again under AddressSanitizer and under
    # UndefinedBehaviorSanitizer.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    needs: presubmit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (KVM, Bazelisk, user.bazelrc)
        run: ./.github/ci/prepare.sh
      - name: Restore the repository cache
        id: repocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-
      - name: Restore Bazel caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: bazel-full-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-full-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-full-
            bazel-
      - name: Test (all tiers)
        run: ./.github/ci/test.sh
      - name: Test (AddressSanitizer)
        if: ${{ !cancelled() }}
        run: ./.github/ci/test.sh --config=asan
      - name: Test (UndefinedBehaviorSanitizer)
        if: ${{ !cancelled() }}
        run: ./.github/ci/test.sh --config=ubsan
      - name: Report the accelerator
        if: ${{ !cancelled() }}
        run: ./.github/ci/accelerator.sh
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-full
          path: ci-test-logs
          if-no-files-found: ignore
      - name: Save the repository cache
        if: ${{ !cancelled() && steps.repocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo-cache
          key: ${{ steps.repocache.outputs.cache-primary-key }}
      - name: Save Bazel caches
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazelisk
          key: ${{ steps.cache.outputs.cache-primary-key }}

  osv:
    # Dependency vulnerability scan (plan step 5.3; tools/sbom/README.md and
    # README.md "Dependency vulnerability scanning"). Only what the dcfs
    # binaries link (the shipped SBOM) gates: each shipped project is scanned
    # by its upstream git commit, the form OSV matches C/C++ projects by.
    # The test-only pins (Debian image, kernel, QEMU, busybox, ...) are
    # scanned informationally and never fail the job. The scanner version is
    # the one of the action pinned below (its image,
    # ghcr.io/google/osv-scanner-action:v2.6.0). Fails on any shipped finding
    # that osv-scanner.toml does not ignore, and on an expired ignore.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the runner (Bazelisk, which fetches the Alpine packages)
        run: ./.github/ci/prepare.sh
      - name: Check ignores and pinned commits, generate the SBOMs and git roots
        run: ./.github/ci/osv.sh
      - name: Scanner self-check (libfuse 3.2.0 must be found, CVE-2018-10906)
        id: seeded
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan
            source
            --include-git-root
            --no-ignore
            -r
            osv/seeded-git
      - name: The self-check found something
        run: |
          test "${{ steps.seeded.outcome }}" = failure || {
            echo "scanner reported nothing for libfuse 3.2.0 (a known-vulnerable commit): the shipped scan is vacuous" >&2
            exit 1
          }
      - name: Scan the shipped dependencies (gates)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan
            source
            --config=osv-scanner.toml
            --include-git-root
            --no-ignore
            -r
            osv/shipped-git
      - name: Scan the test-only dependencies (informational, never fails)
        id: testonly
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan
            source
            -L
            osv/testonly.cdx.json
      - name: Test-only scan result
        run: |
          if test "${{ steps.testonly.outcome }}" = success; then
            echo "test-only dependencies: no findings (informational)"
          else
            echo "test-only dependencies: findings listed in the step above (informational, not gating)"
          fi
