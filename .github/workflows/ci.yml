# Build only. Every dcfs test, unit tests included, runs as root inside a
# QEMU guest booted with KVM from the project's own kernel (see README.md's
# "Testing" and test/qemu/README.md). GitHub's hosted runners have no KVM,
# so running `bazel test` here would only fail; tests need a KVM-capable
# self-hosted runner (Phase 5 wires this up; the test kernel itself is now
# stock and Bazel-built, so no out-of-tree kernel build is needed there).
# `bazel build //...` builds every test binary without running any.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: bazel build //...
