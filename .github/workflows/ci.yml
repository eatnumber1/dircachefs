# Build only. Every dcfs test, unit tests included, runs as root inside a
# QEMU guest booted with KVM from a kernel carrying the not-yet-upstream
# FUSE_ATTR_GENERATION patch (see README.md's "Testing" and
# test/qemu/README.md). GitHub's hosted runners have neither KVM nor that
# kernel, so running `bazel test` here would only fail; tests need a
# KVM-capable self-hosted runner with the patched kernel built by
# test/qemu/scripts/build-kernel.sh. `bazel build //...` works without the
# kernel (it is a placeholder until built) and builds every test binary.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: bazel build //...
