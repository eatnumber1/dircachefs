    # Step 17.1: xfstests' generic tests against dcfs, one runner per backing
    # file system (.github/ci/test.sh --tag=xfstests-<fstype>): the six shards
    # of a file system (`enormous`, two vCPUs and 1 GiB each) two at a time on
    # the runner's four vCPUs. Their own job because eighteen shards of 11 to
    # 21 minutes would roughly double `full` (test.sh leaves the tag out of its
    # partition, and of `asan` and `ubsan`, where the shards are incompatible
