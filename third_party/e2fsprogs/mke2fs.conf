# The mke2fs profile every image made with the Bazel-built mke2fs uses
# (MKE2FS_CONFIG; see README.md, "mke2fs.conf"). It is e2fsprogs 1.47.4's own
# built-in default profile (misc/mke2fs.conf.in, byte for byte apart from this
# header and the one change below), checked in so that no image depends on the host's
# /etc/mke2fs.conf (which differs between distributions and releases: this
# machine's lacks metadata_csum_seed and orphan_file) or on the sandbox path
# configure baked in as the config file's location.
#
# One deliberate difference from 1.47.4's profile (R3, russ): the "small" and
# "floppy" fs_types (filesystems under 512 MiB and 3 MiB) use 4096-byte
# blocks, not 1024, so the small scratch filesystems the tests make have the
# block size of a real disk. Their inode_ratio is unchanged.
#
# Changing a line here changes every ext4 image the tests make: update
# mke2fs_conf_test.sh with it.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext3 = {
		features = has_journal
	}
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,metadata_csum_seed,64bit,dir_nlink,extra_isize,orphan_file
	}
	small = {
		blocksize = 4096
		inode_ratio = 4096
	}
	floppy = {
		blocksize = 4096
		inode_ratio = 8192
	}
	big = {
		inode_ratio = 32768
	}
	huge = {
		inode_ratio = 65536
	}
	news = {
		inode_ratio = 4096
	}
	largefile = {
		inode_ratio = 1048576
		blocksize = -1
	}
	largefile4 = {
		inode_ratio = 4194304
		blocksize = -1
	}
	hurd = {
	     blocksize = 4096
	     inode_size = 128
	     warn_y2038_dates = 0
	}
