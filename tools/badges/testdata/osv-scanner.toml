[[IgnoredVulns]]
id = "DEBIAN-CVE-2026-8674"
ignoreUntil = 2027-01-06
reason = "the DNS stub resolver reading an /etc/resolv.conf search list; dcfs does no DNS (tools/banned_symbols.txt). Fixed in Debian 14 (forky) with glibc 2.43-6, not in trixie."

[[IgnoredVulns]]
