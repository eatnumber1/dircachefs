\* Timely interrupts, liveness (step 22.5; medium test tier): an interrupted
\* request eventually replies, EINTR at an interruption point, under the
\* weak fairness of each request's own steps (FairSpec). One slot, every request
\* kind, one crash; MC_interrupt_liveness_slots.cfg has two slots, so that
\* another request can hold the thread. Checked without a VIEW (merging
\* states can hide or invent cycles), with InterruptBound besides.
SPECIFICATION FairSpec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1"}
    Requests <- WithAttrChanges
    MaxMutations = 1
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = TRUE
    \* Of the reply ghost, only whether the reply was EINTR (InterruptActedOn
    \* reads it): without a VIEW the idle slots' last replies would multiply
    \* the states.
    RecordReply <- RecordEintr
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
INVARIANTS
    TypeOK
    InterruptBound
    InterruptPrompt
PROPERTIES
    QuietStepsUncounted
    InterruptedReplies
    InterruptActedOn
