\* Litmus (step 12.8; MClitmus.tla): implied directory fsync with the file's
\* fsync alone as the barrier (SyncBarrier <- FsyncOnly: the program as on
\* the backing filesystem directly; not the code), metadata-prefix regime.
\* Expected: holds: DFSCQ's fsync of a file ends the tree sequence (all
\* pending metadata, the create included, and the file's data). The sync
\* point's ClearDirty after it is then safe too: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "fsync"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "metaprefix"
    DirFsyncPersistsFiles = FALSE
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncFile
    LitmusBad <- BadAfterFsync
    SyncBarrier <- FsyncOnly
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    LitmusOK
    LitmusBackingOK
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
