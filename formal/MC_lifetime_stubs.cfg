\* The lifetime model with boundary stubs: one row id, two refused names
\* and two stub nodeids, stubs going after out-of-band relistings
\* (OutOfBand); every invariant. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    MaxId = 1
    StubIds = {11, 12}
    Boundaries = {m1, m2}
    MaxLookups = 2
    MaxOpens = 2
    MaxCrashes = 1
    OutOfBand = TRUE
    DestroyWithOpens = FALSE
    BugNonFinalForgetDropsHeld = FALSE
    BugNonFinalForgetDropsRec = FALSE
    BugNoUnnamedSweep = FALSE
    BugForgetMultiCountsOne = FALSE
    BugStubIdFromMax = FALSE
INVARIANTS
    TypeOK
    NodeidStable
    ReferencedServed
    NotRetiredWhileReferenced
    HeldOnlyWhileWritten
    WrittenUntilLastForget
    ForgetKnown
    LookupsExact
    NothingLeaks
    KernelForgotAfterCrash
    UnnamedRowsSwept
