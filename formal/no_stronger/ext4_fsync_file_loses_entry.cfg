\* No stronger than ext4 here (step 25.28b; MClitmus.tla, "a non-guarantee
\* pinned"): implied directory fsync through dcfs, ext4 regime. create f,
\* write f, FSYNC of f. Expected: LitmusOK is violated: after the fsync
\* returned, a power loss may leave no f (EntryLostAfterFsync), as
\* Definition 7 allows (it orders before an fsync of f only the updates of
\* f, and the create of f is an update of D). Real ext4 commits its journal
\* at an fsync, the create with it; the regime is the paper's
\* specification, which allows more. dcfs adds no barrier (no syncfs): one
\* would hide the loss and fail this test. What the fsync does guarantee:
\* MC_litmus_fsync_file_ext4.cfg.
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "fsync"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "ext4"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncFile
    LitmusBad <- EntryLostAfterFsync
INVARIANTS
    LitmusOK
