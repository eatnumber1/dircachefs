\* No stronger than the metadata-prefix regime here (step 25.28b;
\* MClitmus.tla, "a non-guarantee pinned"): directory fsync through dcfs,
\* DirFsyncPersistsFiles = FALSE (DFSCQ: an fsync of a directory flushes
\* metadata, not data). create f, write f, FSYNCDIR of D. Expected: LitmusOK
\* is violated: after the fsync returned, a power loss may leave f there,
\* empty (DataLostAfterFsync). dcfs adds no barrier (no syncfs): one would
\* hide the loss and fail this test. What the fsync does guarantee:
\* MC_litmus_fsync_dir_metaprefix.cfg.
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "fsyncdir"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "metaprefix"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncDir
    LitmusBad <- DataLostAfterFsync
INVARIANTS
    LitmusOK
