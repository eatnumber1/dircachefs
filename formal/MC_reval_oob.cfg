\* The revalidation model with changes behind dcfs's back (OutOfBand):
\* the flags part still holds (the GETFLAGS re-check and the reopen ask the
\* backing file). The mode and the directory do not: limitations/.
SPECIFICATION Spec
SYMMETRY HandleSymmetry
CONSTANTS
    Handles = {h1, h2}
    OutOfBand = TRUE
    MaxChanges = 3
    BugNoRecheck = FALSE
    BugRecheckOnlyIfChanged = FALSE
    BugCasefoldPassedThrough = FALSE
    BugNoWriteFd = FALSE
    BugWriteFdLastWriter = FALSE
    BugWriteFdNeverDropped = FALSE
INVARIANTS
    TypeOK
    OpenFlagsExact
    HeldFlagsLegit
    WriteFdHeld
    WriteFdOnlyBesideWriters
    WriteFdKeepsOffsets
    WritesUseAWritableFd
