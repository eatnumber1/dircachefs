\* Trace validation of a file's trace against the revalidation model
\* (RevalTrace.tla), read from $DCFS_TRACE. Out-of-band changes happen only
\* where the trace has an "oob" line; every Bug* constant is FALSE (the
\* code as it is). formal/trace_validate.sh runs TLC with this
\* configuration on each file's trace.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Handles <- TraceHandles
    OutOfBand = TRUE
    MaxChanges <- TraceMaxChanges
    BugNoRecheck = FALSE
    BugRecheckOnlyIfChanged = FALSE
    BugCasefoldPassedThrough = FALSE
    BugNoWriteFd = FALSE
    BugWriteFdLastWriter = FALSE
    BugWriteFdNeverDropped = FALSE
