\* As MC_ident_power.cfg (a power loss and a crash, the generation in the
\* handle the only evidence: no FS_IOC_GETVERSION, no birth time, as for an
\* ext4 symlink without a birth time), with the backing directory also
\* changing behind dcfs's back (OutOfBand = TRUE). Identity resolution under
\* out-of-band changes with generation-only evidence; added when a named-open
\* design was shown to break it (Phase 13 review, 2026-10-09). Every
\* property but ServedWhileLive. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {}
    Evidence = {"handle_gen"}
    MaxRowId = 3
    StubIds = {}
    MaxMints = 3
    MaxHandles = 2
    MaxCrashes = 1
    MaxPowerLosses = 1
    MaxWipes = 0
    Target = FALSE
    OutOfBand = TRUE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
INVARIANTS
    TypeOK
    OneHandleOneObject
    HeldResolvesToItsObject
    HandlesResolveToTheirObject
    GoneIsStale
    ReuseDetected
    NoBadInode
