\* Trace validation of a nodeid's identity trace against the identity
\* model (IdentTrace.tla), read from $DCFS_TRACE; every Bug* constant is
\* FALSE (the code as it is). formal/trace_validate.sh runs TLC with this
\* configuration on each nodeid's identity trace.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Objs = {}
    Names = {}
    InitBName <- TraceNames
    InoOf <- TraceInts
    GenOf <- TraceInts
    Boundaries = {}
    Evidence = {}
    MaxRowId = 0
    StubIds = {}
    MaxMints = 0
    MaxHandles = 0
    MaxCrashes = 0
    MaxPowerLosses = 0
    MaxWipes = 0
    Target = FALSE
    OutOfBand = FALSE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
