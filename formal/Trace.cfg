\* Trace validation (Trace.tla): one recorded trace, read from the file
\* named by $DCFS_TRACE. The model's constants come from the trace; every
\* Bug* constant is FALSE (the code as it is). formal/trace_validate.sh runs
\* TLC with this configuration on each trace.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Names <- TraceNames
    Procs <- TraceProcs
    Requests <- AllKinds
    MaxMutations <- TraceBound
    MaxCrashes <- TraceBound
    KernelDirLock <- TraceLock
    Interrupts = TRUE
    NameOrder <- TraceNameOrder
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    OutOfSlotFill <- GetattrWhole
\* The effect points (dcfs.tla, step 12.7) on every recorded behavior; the
\* fills the code makes outside a request slot (a child's or parent's row,
\* the root's attributes at InitRoot: GetattrWhole) are commits too. And
\* the replies (step 12.7b): every reply the model's requests make while
\* following the trace is one the backing filesystem gave; T_Reply checks
\* that the code's reply has the same errno class.
\* Every mutation that began ends (step 12.11: an attribute change's End is
\* an event; without it the trace is rejected at the next line).
INVARIANTS
    GuardsBalanced
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
