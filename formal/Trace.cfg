\* Trace validation (Trace.tla): one recorded trace, read from the file
\* named by $DCFS_TRACE. The model's constants come from the trace; every
\* Bug* constant is FALSE (the code as it is). formal/trace_validate.sh runs
\* TLC with this configuration on each trace.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Names <- TraceNames
    Procs <- TraceProcs
    Requests <- AllKinds
    MaxMutations <- TraceBound
    MaxCrashes <- TraceBound
    KernelDirLock <- TraceLock
    NameOrder <- TraceNameOrder
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
