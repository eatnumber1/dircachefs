\* The small configuration (medium test tier; target: about a minute).
\* Two names, two concurrent requests, two mutations, one crash; the kernel's
\* lock on the directory and exclusive sync points, as dcfs runs today; every
\* request kind and every invariant. RecoveryTerminates (liveness, which
\* must not be checked under a VIEW) is checked by MC_liveness.cfg.
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1", "p2"}
    Requests <- AllRequests
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    SyncExclusive = TRUE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
VIEW View
