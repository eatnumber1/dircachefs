\* The lifetime model (lifetime.tla), the code as it is: two names, three
\* objects, two row ids, lookups counted to 2, two opens per nodeid, one
\* crash; every invariant. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    MaxId = 2
    StubIds = {}
    Boundaries = {}
    MaxLookups = 2
    MaxOpens = 2
    MaxCrashes = 1
    OutOfBand = FALSE
    DestroyWithOpens = FALSE
    BugNonFinalForgetDropsHeld = FALSE
    BugNonFinalForgetDropsRec = FALSE
    BugNoUnnamedSweep = FALSE
    BugForgetMultiCountsOne = FALSE
    BugStubIdFromMax = FALSE
    BugNoRecoveredProbe = FALSE
INVARIANTS
    TypeOK
    NodeidStable
    ReferencedServed
    NotRetiredWhileReferenced
    HeldOnlyWhileWritten
    WrittenUntilLastForget
    ForgetKnown
    LookupsExact
    NothingLeaks
    KernelForgotAfterCrash
    UnnamedRowsSwept
    RowsNameLiveObjects
