\* Trace.cfg with RecoverDirty split in two transactions (dcfs.tla's
\* RecoverClearsDirtyFirst: known_bugs/recover_clears_dirty_first) as the
\* model, for trace_tests/recover_crash.log.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Names <- TraceNames
    Procs <- TraceProcs
    Requests <- AllKinds
    MaxMutations <- TraceBound
    MaxCrashes <- TraceBound
    KernelDirLock <- TraceLock
    NameOrder <- TraceNameOrder
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    OutOfSlotFill <- GetattrWhole
    Recover <- RecoverClearsDirtyFirst
    Modes <- BugModes
