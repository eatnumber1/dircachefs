\* RevalTrace.cfg with BugRecheckOnlyIfChanged (formal/known_bugs/reval_recheck_if_changed.tla): a
\* known-bug variant of reval.tla as the model, for trace_tests/reval_*.log.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Handles <- TraceHandles
    OutOfBand = TRUE
    MaxChanges <- TraceMaxChanges
    BugNoRecheck = FALSE
    BugRecheckOnlyIfChanged = TRUE
    BugCasefoldPassedThrough = FALSE
    BugNoWriteFd = FALSE
    BugWriteFdLastWriter = FALSE
