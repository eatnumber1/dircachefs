\* RevalTrace.cfg with BugNoRecheck (formal/known_bugs/reval_no_recheck.tla): a
\* known-bug variant of reval.tla as the model, for trace_tests/reval_*.log.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Handles <- TraceHandles
    OutOfBand = TRUE
    MaxChanges <- TraceMaxChanges
    BugNoRecheck = TRUE
    BugRecheckOnlyIfChanged = FALSE
    BugCasefoldPassedThrough = FALSE
    BugNoWriteFd = FALSE
    BugWriteFdLastWriter = FALSE
