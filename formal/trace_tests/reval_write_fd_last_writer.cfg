\* RevalTrace.cfg with BugWriteFdLastWriter (formal/known_bugs/reval_write_fd_last_writer.tla): a
\* known-bug variant of reval.tla as the model, for trace_tests/reval_*.log.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Handles <- TraceHandles
    OutOfBand = TRUE
    MaxChanges <- TraceMaxChanges
    BugNoRecheck = FALSE
    BugRecheckOnlyIfChanged = FALSE
    BugCasefoldPassedThrough = FALSE
    BugNoWriteFd = FALSE
    BugWriteFdLastWriter = TRUE
    BugWriteFdNeverDropped = FALSE
