\* LifetimeTrace.cfg with BugNonFinalForgetDropsRec: a known-bug variant of
\* lifetime.tla (known_bugs/lifetime_nonfinal_forget_drops_rec.tla)
\* as the model, for trace_tests/life_*.log.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Objs <- TraceObjs
    Names = {}
    InitBName <- TraceBName
    MaxId = 1
    StubIds = {}
    Boundaries = {}
    MaxLookups <- TraceMax
    MaxOpens <- TraceMax
    MaxCrashes = 1
    OutOfBand = FALSE
    DestroyWithOpens = TRUE
    BugNonFinalForgetDropsHeld = FALSE
    BugNonFinalForgetDropsRec = TRUE
    BugNoUnnamedSweep = FALSE
    BugForgetMultiCountsOne = FALSE
    BugStubIdFromMax = FALSE
