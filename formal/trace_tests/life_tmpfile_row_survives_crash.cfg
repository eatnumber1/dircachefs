\* LifetimeTrace.cfg with BugNoUnnamedSweep: a known-bug variant of
\* lifetime.tla (known_bugs/lifetime_tmpfile_row_survives_crash.tla)
\* as the model, for trace_tests/life_*.log.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Objs <- TraceObjs
    Names = {}
    InitBName <- TraceBName
    MaxId = 1
    StubIds = {}
    Boundaries = {}
    MaxLookups <- TraceMax
    MaxOpens <- TraceMax
    MaxCrashes = 1
    OutOfBand = FALSE
    DestroyWithOpens = TRUE
    BugNonFinalForgetDropsHeld = FALSE
    BugNonFinalForgetDropsRec = FALSE
    BugNoUnnamedSweep = TRUE
    BugForgetMultiCountsOne = FALSE
    BugStubIdFromMax = FALSE
