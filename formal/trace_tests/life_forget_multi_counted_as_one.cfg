\* LifetimeTrace.cfg with BugForgetMultiCountsOne: a known-bug variant of
\* lifetime.tla (known_bugs/lifetime_forget_multi_counted_as_one.tla)
\* as the model, for trace_tests/life_*.log.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Objs <- TraceObjs
    Names = {}
    InitBName <- TraceBName
    MaxId = 1
    StubIds = {}
    Boundaries = {}
    MaxLookups <- TraceMax
    MaxOpens <- TraceMax
    MaxCrashes = 1
    OutOfBand = FALSE
    DestroyWithOpens = TRUE
    BugNonFinalForgetDropsHeld = FALSE
    BugNonFinalForgetDropsRec = FALSE
    BugNoUnnamedSweep = FALSE
    BugForgetMultiCountsOne = TRUE
    BugStubIdFromMax = FALSE
    BugNoRecoveredProbe = FALSE
    BugSweepOnlyUnclean = FALSE
