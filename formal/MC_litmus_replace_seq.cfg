\* Litmus (step 12.8; MClitmus.tla): atomic replace via rename (Ferrite's
\* ARVR) through dcfs, sequential regime. f holds old contents; create t,
\* write t, rename t over f. Expected: holds. A power loss leaves a prefix of
\* the writes, so f holds the old contents or the new, through dcfs and on
\* the backing filesystem. Every invariant of dcfs too.
SPECIFICATION Spec
CONSTANTS
    Names = {"f", "t"}
    Procs = {"p1"}
    Requests = {"create", "write", "rename"}
    MaxMutations = 3
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    ArriveAllowed <- ScriptAllows
    InitPresent <- WithF
    Script <- ViaRename
    LitmusBad <- BadReplace
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    LitmusOK
    LitmusBackingOK
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
