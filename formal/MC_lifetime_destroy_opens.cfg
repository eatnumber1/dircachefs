\* The lifetime model with DESTROY coming while files are still open
\* (SIGTERM, a lazy unmount): as MC_lifetime.cfg with one open per nodeid,
\* every invariant. Medium tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    MaxId = 2
    StubIds = {}
    Boundaries = {}
    MaxLookups = 2
    MaxOpens = 1
    MaxCrashes = 1
    OutOfBand = FALSE
    DestroyWithOpens = TRUE
    BugNonFinalForgetDropsHeld = FALSE
    BugNonFinalForgetDropsRec = FALSE
    BugNoUnnamedSweep = FALSE
    BugForgetMultiCountsOne = FALSE
    BugStubIdFromMax = FALSE
    BugNoRecoveredProbe = FALSE
    BugSweepOnlyUnclean = FALSE
INVARIANTS
    TypeOK
    NodeidStable
    ReferencedServed
    NotRetiredWhileReferenced
    HeldOnlyWhileWritten
    WrittenUntilLastForget
    ForgetKnown
    LookupsExact
    NothingLeaks
    KernelForgotAfterCrash
    UnnamedRowsSwept
    RowsNameLiveObjects
