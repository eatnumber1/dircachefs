\* Step 12.12a: RecoveryTerminates bites on probes_wait_for_clean (the
\* start's probe waits for an empty dirty set). Liveness: no VIEW.
SPECIFICATION Spec
CONSTANTS
    Names = {"a"}
    Procs = {"p1"}
    Requests <- WithAttrChanges
    MaxMutations = 1
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    \* No reply ghost: no reply property is checked here, and without a VIEW
    \* the idle slots' last replies would triple the states (step 12.7b).
    RecordReply <- ForgetReply
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    ProbesDone <- ProbesDoneWaits
PROPERTIES
    RecoveryTerminates
