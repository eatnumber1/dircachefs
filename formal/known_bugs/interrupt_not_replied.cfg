\* Known bug: interrupt_not_replied. See interrupt_not_replied.tla.
\* Liveness: no VIEW. Deadlock checking is off: with InterruptNeverReplies
\* every request can end up stuck, getattrs included since 22.5 made their
\* refreshes interruption points, so a stuck state is a deadlock TLC would
\* report before the temporal property. This variant exists to show
\* InterruptedReplies failing.
SPECIFICATION FairSpec
CONSTANTS
    Names = {"a"}
    Procs = {"p1", "p2"}
    Requests = {"lookup", "getattr", "create"}
    MaxMutations = 1
    MaxCrashes = 0
    KernelDirLock = TRUE
    Interrupts = TRUE
    RecordReply <- ForgetReply
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
    InterruptReplies <- InterruptNeverReplies
CHECK_DEADLOCK FALSE
PROPERTIES
    InterruptedReplies
