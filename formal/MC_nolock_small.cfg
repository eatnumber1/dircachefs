\* Without the kernel's lock, small (medium test tier; step 12.12a, the
\* audit's G4): MC_nolock's two names, two slots and two mutations, no
\* crash, and only the requests whose guards need the lock gone to bite
\* (MC.tla's NolockGuardRequests: lookups, listings, creates, unlinks and
\* renames: with every kind but readdirplus it is 2.0 million states, with
\* sync points added 1.2 million, too many for the medium tier), so that
\* the concurrency guards (Mutation::Owns, the phase-1 verification of an
\* unlink or a rename, the fill guards of lookups and listings that meet a
\* mutation) bite before the large tier
\* (known_bugs/rename_stale_source_nolock_small). Every invariant and the
\* four action properties.
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1", "p2"}
    Requests <- NolockGuardRequests
    MaxMutations = 2
    MaxCrashes = 0
    KernelDirLock = FALSE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
VIEW View
