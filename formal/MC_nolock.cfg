\* Without the kernel's lock on the directory (large test tier; a few
\* minutes on four cores): the coroutine future in which lookups, listings and
\* mutations of one directory interleave freely, so that the fill guards,
\* Mutation::Owns and a rename's phase-1 verification are what keep the
\* cache right. Every request kind.
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1", "p2"}
    Requests <- AllRequests
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
VIEW View
