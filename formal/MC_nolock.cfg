\* Without the kernel's lock on the directory (large test tier; about five
\* minutes on four cores): the coroutine future in which lookups, listings and
\* mutations of one directory interleave freely, so that the fill guards and
\* Mutation::Owns are what keeps the cache right. Rename and readdirplus are
\* left out: each has a gap here (formal/findings/) that TLC would report
\* first.
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1", "p2"}
    Requests <- AllButRenameAndReaddirplus
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = FALSE
    SyncExclusive = TRUE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
VIEW View
