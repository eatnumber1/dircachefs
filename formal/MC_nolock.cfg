\* Without the kernel's lock on the directory (large test tier; a few
\* minutes on four cores): the coroutine future in which lookups, listings and
\* mutations of one directory interleave freely, so that the fill guards,
\* Mutation::Owns and a rename's phase-1 verification are what keep the
\* cache right. Every request kind; not the periodic durable point
\* (MC.tla's NoCacheDurable says why).
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1", "p2"}
    Requests <- AllRequests
    CacheDurable <- NoCacheDurable
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = FALSE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
\* The effect points (step 12.7; added to this configuration by step
\* 12.12a: the audit's G4) and the replies (step 12.7b): without the lock,
\* lookups and listings overlap mutations, so a reply's window holds more
\* than one instant.
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
VIEW View
