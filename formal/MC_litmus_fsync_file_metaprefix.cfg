\* Litmus (step 12.8; MClitmus.tla): implied directory fsync through dcfs,
\* metadata-prefix regime. create f, write f, FSYNC of f. Expected: holds:
\* DFSCQ's fsync of a file ends the tree sequence (all pending metadata, the
\* create included, and the file's data), so once it returned f is there
\* with its data.
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "fsync"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "metaprefix"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncFile
    LitmusBad <- BadAfterFsync
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    LitmusOK
    LitmusBackingOK
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
