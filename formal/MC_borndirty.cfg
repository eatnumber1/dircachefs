\* Step 23.11, born-dirty create: F does not exist yet; its create in D
\* (phase 1 on D, the syscall, phase 3 inserting F's row, dentry and mark
\* in one normal commit, after which F counts as durably dirty), lookups of
\* its name (fills that may insert its row), its setattrs and writes (fset:
\* BeginWriting's fast path on a born-dirty row), getattrs, opens, releases
\* and the kernel's reads, sync points; one slot, the kernel's lock, three
\* changes, one crash, the "seq" regime. Every invariant and property,
\* BornDirty and LostRowProbed among them. Medium test tier.
