\* FUSE_INTERRUPT without the kernel's lock (large test tier, a few
\* minutes): as MC_nolock.cfg with Interrupt, one mutation, one crash.
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1", "p2"}
    Requests <- AllRequests
    MaxMutations = 1
    MaxCrashes = 1
    KernelDirLock = FALSE
    Interrupts = TRUE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
\* Replies (step 12.7b): without the lock, lookups and listings overlap
\* mutations, so a reply's window holds more than one instant.
PROPERTIES
    ReplyObservable
VIEW View
