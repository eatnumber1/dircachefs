\* A name longer than the backing's f_namelen (step 12.24; medium test tier):
\* "b" is never answered from the cache, only resolved alone. Two names, two
\* concurrent requests, one mutation (to interleave with the lookup), one
\* crash; the kernel's
\* lock on the directory, as dcfs runs today, with sync points interleaving
\* with requests as under coroutines; every request kind and every
\* invariant. RecoveryTerminates (liveness, which must not be checked under
\* a VIEW) is checked by MC_liveness.cfg.
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1", "p2"}
    Requests <- WithAttrChanges
    MaxMutations = 1
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    LongNames = {"b"}
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
VIEW View
