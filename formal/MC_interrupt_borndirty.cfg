\* FUSE_INTERRUPT for the born-dirty create (step 22.5; medium test tier):
\* as MC_borndirty.cfg with Interrupt; one slot, two changes, no crash. The
\* bound (InterruptBound) for F's create (FC_sys an interruption point:
\* interrupted, F's name stays unknown and D dirty), its lookups, setattrs,
\* getattrs, opens and releases, and every invariant of MC_borndirty.cfg.
SPECIFICATION Spec
CONSTANTS
    Names = {"a"}
    Procs = {"p1"}
    Requests = {"fcreate", "flookup", "fset", "fgetattr", "fopen", "frelease", "sync"}
    MaxMutations = 2
    MaxCrashes = 0
    KernelDirLock = TRUE
    Interrupts = TRUE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    FInitExists <- NotYet
    Phase3CanFail <- CanFail
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    FileExact
    BornDirty
    LostRowProbed
    RecoveryForgetsDirty
    InterruptBound
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
    DirtyBeforeChange
    ClearOnlyAfterSync
VIEW View
