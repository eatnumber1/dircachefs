\* The protocol under the weakest backing regime (step 12.8): an
\* over-approximation of Ferrite's ext4 model (Definition 7), where a power
\* loss may keep changes of different names of D, D's attributes (from any
\* state since the last syncfs) and files' data in any order. Two names, one
\* slot, three mutations (attribute changes of D included), one crash;
\* every invariant, CrashRefines included, and the effect-point and reply
\* properties. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1"}
    Requests = {"lookup", "getattr", "create", "unlink", "rename", "attrchange", "sync"}
    MaxMutations = 3
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "ext4"
    DirFsyncPersistsFiles = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
VIEW View
