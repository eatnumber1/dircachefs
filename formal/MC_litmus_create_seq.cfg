\* Litmus (step 12.8; MClitmus.tla): atomic create via rename (Ferrite's
\* ACVR) through dcfs, sequential regime. create t, write t, rename t to f
\* (new). Expected: holds: f is absent or holds the data.
SPECIFICATION Spec
CONSTANTS
    Names = {"f", "t"}
    Procs = {"p1"}
    Requests = {"create", "write", "rename"}
    MaxMutations = 3
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- ViaRename
    LitmusBad <- BadCreate
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    LitmusOK
    LitmusBackingOK
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
