\* Litmus (step 12.8; MClitmus.tla): implied directory fsync through dcfs,
\* ext4 regime (Ferrite's Definition 7). create f, write f, FSYNC of f.
\* Expected: holds: once the fsync returned, f is not there without its data
\* (DataLostAfterFsync): Definition 7 orders f's write before an fsync of f.
\* What it does not guarantee, f's entry (step 25.28b: dcfs passes the fsync
\* through, no syncfs), no_stronger/ext4_fsync_file_loses_entry.cfg pins.
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "fsync"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "ext4"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncFile
    LitmusBad <- DataLostAfterFsync
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    LitmusOK
    LitmusBackingOK
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
