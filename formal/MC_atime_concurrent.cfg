\* Step 23.8: as MC_atime.cfg with two slots, so that F's held fills, its
\* setattr's phases and sync points interleave as under coroutines (a held
\* fill rejected by a concurrent one or by the setattr, a release during a
\* sync point's syncfs), without the crash and D's create (F's setattr's
\* mutation row drives the sync points); two changes. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    Names = {"a"}
    Procs = {"p1", "p2"}
    Requests = {"fopen", "frelease", "fgetattr", "fset", "sync"}
    MaxMutations = 2
    MaxCrashes = 0
    Interrupts = FALSE
    KernelDirLock = TRUE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    FileExact
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
VIEW View
