\* The lifetime model with a crash during recovery (step 12.6): as
\* MC_lifetime.cfg with two crashes (so one can come during the start's
\* probe), one lookup and one open per nodeid; every invariant, with
\* RecoveryIdempotent. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    MaxId = 2
    StubIds = {}
    Boundaries = {}
    MaxLookups = 1
    MaxOpens = 1
    MaxCrashes = 2
    OutOfBand = FALSE
    DestroyWithOpens = FALSE
    BugNonFinalForgetDropsHeld = FALSE
    BugNonFinalForgetDropsRec = FALSE
    BugNoUnnamedSweep = FALSE
    BugForgetMultiCountsOne = FALSE
    BugStubIdFromMax = FALSE
    BugNoRecoveredProbe = FALSE
    BugSweepOnlyUnclean = FALSE
INVARIANTS
    TypeOK
    NodeidStable
    ReferencedServed
    NotRetiredWhileReferenced
    HeldOnlyWhileWritten
    WrittenUntilLastForget
    ForgetKnown
    LookupsExact
    NothingLeaks
    KernelForgotAfterCrash
    UnnamedRowsSwept
    RowsNameLiveObjects
