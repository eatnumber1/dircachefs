\* As MC_ident_oob.cfg with the birth time as the only evidence (a
\* filesystem whose handles carry no generation and without
\* FS_IOC_GETVERSION, but with statx's birth time): every invariant still
\* holds. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    o4 = o4
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {}
    Evidence = {"btime"}
    MaxRowId = 3
    StubIds = {}
    MaxMints = 3
    MaxHandles = 2
    MaxCrashes = 1
    MaxPowerLosses = 0
    MaxWipes = 0
    Target = FALSE
    OutOfBand = TRUE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
    BugNoSourceCheck = FALSE
    BugForgetOnError = FALSE
    SwapBName <- MCNoSwap
    SameIdentity = FALSE
    MaxSwaps = 0
    SwapWhileUp = FALSE
    MaxOutages = 0
    VolatileHandles = FALSE
    OpenByIno = TRUE
    TransientEstale = FALSE
    BugUnconfirmedEstale = FALSE
INVARIANTS
    TypeOK
    OneHandleOneObject
    HeldResolvesToItsObject
    HandlesResolveToTheirObject
    ServedWhileLive
    GoneIsStale
    ReuseDetected
    NoBadInode
