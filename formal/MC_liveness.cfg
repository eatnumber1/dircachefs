\* Liveness (medium test tier): RecoveryTerminates, checked without a VIEW
\* (merging states can hide or invent cycles). It concerns only crashes,
\* startup and shutdown, so one request slot is enough; the safety
\* invariants are checked too.
SPECIFICATION Spec
CONSTANTS
    Names = {"a", "b"}
    Procs = {"p1"}
    Requests <- AllRequests
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
PROPERTIES
    RecoveryTerminates
