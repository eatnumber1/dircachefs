\* Boundary stubs: a filesystem mounted at each name (m1, m2), two stub
\* nodeids, mounts and unmounts behind dcfs's back, a power loss (which
\* rolls back last_stub_id). ServedWhileLive is left out (a power loss may
\* lose a stub's row as any row's). Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, m1, m2}
    Names = {a, b}
    InitBName <- MCInitBNameStubs
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {m1, m2}
    Evidence <- AllEvidence
    MaxRowId = 2
    StubIds = {11, 12}
    MaxMints = 3
    MaxHandles = 2
    MaxCrashes = 0
    MaxPowerLosses = 1
    MaxWipes = 0
    Target = FALSE
    OutOfBand = TRUE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
INVARIANTS
    TypeOK
    OneHandleOneObject
    HeldResolvesToItsObject
    HandlesResolveToTheirObject
    GoneIsStale
    ReuseDetected
    NoBadInode
