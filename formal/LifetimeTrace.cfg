\* Trace validation of a nodeid's trace against the lifetime model
\* (LifetimeTrace.tla), read from $DCFS_TRACE; every Bug* constant is FALSE
\* (the code as it is). formal/trace_validate.sh runs TLC with this
\* configuration on each nodeid's trace.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Objs <- TraceObjs
    Names = {}
    InitBName <- TraceBName
    MaxId = 1
    StubIds = {}
    Boundaries = {}
    MaxLookups <- TraceMax
    MaxOpens <- TraceMax
    MaxCrashes = 1
    OutOfBand = FALSE
    DestroyWithOpens = TRUE
    BugNonFinalForgetDropsHeld = FALSE
    BugNonFinalForgetDropsRec = FALSE
    BugNoUnnamedSweep = FALSE
    BugForgetMultiCountsOne = FALSE
    BugStubIdFromMax = FALSE
    BugNoRecoveredProbe = FALSE
    BugSweepOnlyUnclean = FALSE
