\* Limitation (step 25.28b): with no timer, the bound is at requests. An idle
\* daemon keeps its last commits losable for as long as no request comes,
\* so LostWithinInterval, the bound at every moment, does not hold.
\* Expected: LostWithinInterval is violated (a commit, then ticks with no
\* request).
SPECIFICATION Spec
CONSTANTS
    Interval = 3
    BugNeverCheckpoint = FALSE
    BugSyncPointSkipsCheckpoint = FALSE
    BugFsyncSkipsDurablePoint = FALSE
INVARIANTS
    LostWithinInterval
