\* Limitation (step 12.8; limitations/crash_litmus.tla): atomic create via
\* rename (ACVR) through dcfs, metadata-prefix regime. Expected: LitmusOK is
\* violated: f exists without the data.
SPECIFICATION Spec
CONSTANTS
    Names = {"f", "t"}
    Procs = {"p1"}
    Requests = {"create", "write", "rename"}
    MaxMutations = 3
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "metaprefix"
    DirFsyncPersistsFiles = FALSE
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- ViaRename
    LitmusBad <- BadCreate
INVARIANTS
    LitmusOK
