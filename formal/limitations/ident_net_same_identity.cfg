\* Limitation: a network backing replaced between runs by one presenting
\* the same root handle, two filesystems under one fsid number (step
\* 14.10's guarantee of a unique, fixed fsid per export). See
\* ident_limits.tla.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    o4 = o4
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, o2, o4}
    Names = {a, b}
    InitBName <- MCInitBName
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {}
    Evidence <- NfsEvidence
    MaxRowId = 3
    StubIds = {}
    MaxMints = 3
    MaxHandles = 1
    MaxCrashes = 0
    MaxPowerLosses = 0
    MaxWipes = 0
    Target = FALSE
    OutOfBand = FALSE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
    BugNoSourceCheck = FALSE
    BugForgetOnError = FALSE
    SwapBName <- MCSwapBName
    SameIdentity = TRUE
    MaxSwaps = 1
    SwapWhileUp = FALSE
    MaxOutages = 0
    VolatileHandles = FALSE
    OpenByIno = TRUE
INVARIANTS
    HandlesResolveToTheirObject
