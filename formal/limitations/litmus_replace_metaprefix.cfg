\* Limitation (step 12.8; limitations/crash_litmus.tla): atomic replace via
\* rename (ARVR) through dcfs, metadata-prefix regime. Expected: LitmusOK is
\* violated: the rename persists, t's data does not, and dcfs serves f empty
\* after recovery (as the backing filesystem has it: CrashRefines).
SPECIFICATION Spec
CONSTANTS
    Names = {"f", "t"}
    Procs = {"p1"}
    Requests = {"create", "write", "rename"}
    MaxMutations = 3
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "metaprefix"
    DirFsyncPersistsFiles = FALSE
    ArriveAllowed <- ScriptAllows
    InitPresent <- WithF
    Script <- ViaRename
    LitmusBad <- BadReplace
INVARIANTS
    LitmusOK
