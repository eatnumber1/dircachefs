\* Limitation (step 12.8; limitations/crash_litmus.tla): directory
\* fsync with D's fsync alone as the barrier (not the code), metadata-prefix
\* regime, DirFsyncPersistsFiles = FALSE (DFSCQ: an fsync of a directory
\* flushes metadata, not data). Expected: LitmusBackingOK is violated.
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "sync"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "metaprefix"
    DirFsyncPersistsFiles = FALSE
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncDir
    LitmusBad <- BadAfterFsync
    SyncBarrier <- FsyncOnly
INVARIANTS
    LitmusBackingOK
