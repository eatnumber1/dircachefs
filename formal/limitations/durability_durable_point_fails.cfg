\* Limitation (step 25.28b): a durable point that fails (an I/O error of
\* the cache disk) leaves every commit losable until the next start (no
\* later durable point repairs it: durability.tla), so the bound holds only
\* with its exception. Expected: BoundIgnoringFailures is violated.
SPECIFICATION Spec
CONSTANTS
    Interval = 3
    BugNeverCheckpoint = FALSE
    BugSyncPointSkipsCheckpoint = FALSE
    BugFsyncSkipsDurablePoint = FALSE
INVARIANTS
    BoundIgnoringFailures
