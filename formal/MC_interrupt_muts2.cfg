\* FUSE_INTERRUPT with two mutations (large test tier, a few minutes): as
\* MC_interrupt.cfg with MaxMutations 2 and no crash, so that a mutation
\* can follow an interrupted one. Without the periodic durable point
\* (CacheDurable <- NoCacheDurable): every read of dbOpts is universal, and
\* this runs near its timeout (MC.tla's NoCacheDurable says why).
SPECIFICATION Spec
CONSTANTS
    CacheDurable <- NoCacheDurable
    Names = {"a", "b"}
    Procs = {"p1", "p2"}
    Requests <- AllRequests
    MaxMutations = 2
    MaxCrashes = 0
    KernelDirLock = TRUE
    Interrupts = TRUE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
    \* Arrival only where it can matter (dcfs.tla, CanArriveWhereItMatters).
    CanArrive <- CanArriveWhereItMatters
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    InterruptBound
    InterruptPrompt
\* Replies (step 12.7b): the reply ghost's states are paid for here anyway.
PROPERTIES
    ReplyObservable
VIEW View
