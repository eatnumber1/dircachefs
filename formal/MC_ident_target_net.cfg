\* Phase 14's identity on an NFS client (step 14.10): the nodeid is the
\* fileid, the generation the one in the server's handle (dcfs's digest of
\* its bytes), and a nodeid without a row cannot be opened by number
\* (OpenByIno = FALSE: the client needs the server's handle), so it is
\* ESTALE. A daemon crash and a server outage; every invariant. (A power
\* loss or a wipe loses rows, and a handle of an object nothing has found
\* by name again is then ESTALE: limitations/ident_target_net_wipe.)
\* Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    o4 = o4
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {}
    Evidence <- NfsEvidence
    MaxRowId = 3
    StubIds = {}
    MaxMints = 3
    MaxHandles = 2
    MaxCrashes = 1
    MaxPowerLosses = 0
    MaxWipes = 0
    Target = TRUE
    OutOfBand = FALSE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
    BugNoSourceCheck = FALSE
    BugForgetOnError = FALSE
    SwapBName <- MCNoSwap
    SameIdentity = FALSE
    MaxSwaps = 0
    SwapWhileUp = FALSE
    MaxOutages = 1
    VolatileHandles = FALSE
    OpenByIno = FALSE
INVARIANTS
    TypeOK
    OneHandleOneObject
    HeldResolvesToItsObject
    HandlesResolveToTheirObject
    ServedWhileLive
    GoneIsStale
    ReuseDetected
    NoBadInode
