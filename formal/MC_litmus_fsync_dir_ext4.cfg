\* Litmus (step 12.8; MClitmus.tla): directory fsync through dcfs, ext4
\* regime, an fsync of D not persisting the files' data
\* (DirFsyncPersistsFiles = FALSE: what step 11.2's ACE tests found). create
\* f, write f, FSYNCDIR of D. Expected: holds: once the fsync returned, f is
\* there (EntryLostAfterFsync): Definition 7 orders every update of D before
\* an fsync of D. What it does not guarantee, f's data (step 25.28b: dcfs
\* passes the fsync through, no syncfs),
\* no_stronger/ext4_fsync_dir_loses_data.cfg pins.
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "fsyncdir"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "ext4"
    DirFsyncPersistsFiles = FALSE
    LongNames = {}
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncDir
    LitmusBad <- EntryLostAfterFsync
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    LitmusOK
    LitmusBackingOK
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
