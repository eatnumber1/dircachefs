\* Litmus (step 12.8; MClitmus.tla): directory fsync through dcfs, ext4
\* regime, an fsync of D that also persists the files D names
\* (DirFsyncPersistsFiles = TRUE). Expected: holds: once the fsync returned,
\* f is there with its data; the switch is what decides
\* (no_stronger/ext4_fsync_dir_loses_data.cfg has it FALSE).
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "fsyncdir"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "ext4"
    DirFsyncPersistsFiles = TRUE
    LongNames = {}
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncDir
    LitmusBad <- BadAfterFsync
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    LitmusOK
    LitmusBackingOK
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
