\* Litmus (step 12.8; MClitmus.tla): directory fsync with D's fsync alone as
\* the barrier (SyncBarrier <- FsyncOnly; not the code), ext4 regime, an
\* fsync of D that also persists the files D names (DirFsyncPersistsFiles =
\* TRUE). Expected: holds: the switch is what decides
\* (limitations/litmus_fsync_dir_direct_ext4.cfg has it FALSE).
SPECIFICATION Spec
CONSTANTS
    Names = {"f"}
    Procs = {"p1"}
    Requests = {"create", "write", "sync"}
    MaxMutations = 2
    MaxCrashes = 1
    KernelDirLock = TRUE
    Interrupts = FALSE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "ext4"
    DirFsyncPersistsFiles = TRUE
    ArriveAllowed <- ScriptAllows
    InitPresent <- Empty
    Script <- FsyncDir
    LitmusBad <- BadAfterFsync
    SyncBarrier <- FsyncOnly
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    CrashRefines
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    LitmusOK
    LitmusBackingOK
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
