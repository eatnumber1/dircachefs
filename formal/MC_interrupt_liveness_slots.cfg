\* Timely interrupts, liveness with two slots (step 22.5; large test
\* tier): as MC_interrupt_liveness.cfg, with another request that can hold
\* the thread while the interrupted one waits for it. One name (so no
\* rename: MC_interrupt_liveness.cfg has them) and no crash keep it
\* affordable.
SPECIFICATION FairSpec
CONSTANTS
    Names = {"a"}
    Procs = {"p1", "p2"}
    Requests <- WithAttrChanges
    MaxMutations = 1
    MaxCrashes = 0
    KernelDirLock = TRUE
    Interrupts = TRUE
    RecordReply <- RecordEintr
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
    Reorder = "seq"
    DirFsyncPersistsFiles = FALSE
INVARIANTS
    TypeOK
    InterruptBound
    InterruptPrompt
PROPERTIES
    InterruptedReplies
    InterruptActedOn
