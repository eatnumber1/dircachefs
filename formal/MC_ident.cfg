\* The identity model (ident.tla), today's identity, the code as it is: two
\* names, three objects (o3 recycles o1's inode number), ext4's evidence,
\* three row ids, two NFS handles, one daemon crash, exclusive access;
\* every invariant. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    o4 = o4
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {}
    Evidence <- AllEvidence
    MaxRowId = 3
    StubIds = {}
    MaxMints = 3
    MaxHandles = 2
    MaxCrashes = 1
    MaxPowerLosses = 0
    MaxWipes = 0
    Target = FALSE
    OutOfBand = FALSE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
    BugNoSourceCheck = FALSE
    BugForgetOnError = FALSE
    SwapBName <- MCNoSwap
    SameIdentity = FALSE
    MaxSwaps = 0
    SwapWhileUp = FALSE
    MaxOutages = 0
    VolatileHandles = FALSE
    OpenByIno = TRUE
    TransientEstale = FALSE
    BugUnconfirmedEstale = FALSE
INVARIANTS
    TypeOK
    OneHandleOneObject
    HeldResolvesToItsObject
    HandlesResolveToTheirObject
    ServedWhileLive
    GoneIsStale
    ReuseDetected
    NoBadInode
