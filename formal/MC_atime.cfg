\* Step 23.8: access times of a file F (dcfs.tla, "Access times of a
\* file"): F's opens, releases (the held fill), getattrs (held fill, cached,
\* or a refresh), setattrs and the kernel's reads, a create in D (whose
\* mutation row drives sync points: F's atime-only row does not) and sync
\* points; one name, one slot, three changes, one crash (the crash cases:
\* MC_atime_concurrent.cfg has the interleavings). Every invariant,
\* FileExact (exact while not held, except after a power loss) among them.
\* Medium test tier.
SPECIFICATION Spec
CONSTANTS
    Names = {"a"}
    Procs = {"p1"}
    Requests = {"fopen", "frelease", "fgetattr", "fset", "create", "sync"}
    MaxMutations = 3
    MaxCrashes = 1
    Interrupts = FALSE
    KernelDirLock = TRUE
    BugPhase1NotDurable = FALSE
    BugCreateKeepsParentAttrs = FALSE
    BugUnguardedFills = FALSE
    BugRestoreComplete = FALSE
    BugSyncIgnoresMutations = FALSE
    BugReaddirplusUnlocked = FALSE
    BugRenameStaleSource = FALSE
    BugInterruptAfterSyscall = FALSE
    BugInterruptUndo = FALSE
    BugInterruptLeaksGuard = FALSE
INVARIANTS
    TypeOK
    CacheNeverWrong
    CompleteNeverHides
    TriState
    CrashSafe
    RecoveryIdempotent
    DurableSetSound
    CleanMeansNoDirty
    ServedFromCacheIsCurrent
    GuardsBalanced
    FileExact
PROPERTIES
    EffectAtSyscall
    BackingAtSyscall
    CacheLearnsAtCommit
    ReplyObservable
