\* Phase 14's identity (Target): the nodeid is the backing inode number,
\* the generation the handle's. With a power loss and a cache wipe, every
\* invariant holds, ServedWhileLive included (today's identity loses
\* handles to both: limitations/ident_wipe, limitations/ident_power_loss).
\* Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {}
    Evidence <- AllEvidence
    MaxRowId = 3
    StubIds = {}
    MaxMints = 3
    MaxHandles = 2
    MaxCrashes = 1
    MaxPowerLosses = 1
    MaxWipes = 1
    Target = TRUE
    OutOfBand = FALSE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
INVARIANTS
    TypeOK
    OneHandleOneObject
    HeldResolvesToItsObject
    HandlesResolveToTheirObject
    ServedWhileLive
    GoneIsStale
    ReuseDetected
    NoBadInode
