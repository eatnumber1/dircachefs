\* A network backing (step 14.10), today's identity: an NFS client's
\* evidence (the server's generation inside the handle, nothing else), a
\* server outage answering a transient ESTALE (TransientEstale: the parent
\* check must not take it for absence, 14.10b's rule), a daemon crash, and
\* the backing replaced while dcfs is
\* down by another one whose root handle differs (another fsid, another
\* export) and whose o4 has, as the worst case, a handle byte-identical to
\* o1's. The start's root check refuses it and starts cold (StartRefused).
\* Every invariant. Medium test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    o4 = o4
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, o2, o3, o4}
    Names = {a, b}
    InitBName <- MCInitBName
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {}
    Evidence <- NfsEvidence
    MaxRowId = 3
    StubIds = {}
    MaxMints = 4
    MaxHandles = 2
    MaxCrashes = 1
    MaxPowerLosses = 0
    MaxWipes = 0
    Target = FALSE
    OutOfBand = FALSE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
    BugNoSourceCheck = FALSE
    BugForgetOnError = FALSE
    SwapBName <- MCSwapBName
    SameIdentity = FALSE
    MaxSwaps = 1
    SwapWhileUp = FALSE
    MaxOutages = 1
    VolatileHandles = FALSE
    OpenByIno = TRUE
    TransientEstale = TRUE
    BugUnconfirmedEstale = FALSE
INVARIANTS
    TypeOK
    OneHandleOneObject
    HeldResolvesToItsObject
    HandlesResolveToTheirObject
    ServedWhileLive
    GoneIsStale
    ReuseDetected
    NoBadInode
