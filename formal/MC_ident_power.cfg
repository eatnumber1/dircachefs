\* As MC_ident.cfg, with a power loss (the database rolls back to its last
\* durable commit) and the weakest evidence a supported filesystem gives:
\* the generation in the handle only (no FS_IOC_GETVERSION, no birth time,
\* as for an ext4 symlink without a birth time). ServedWhileLive is left
\* out: a power loss may lose rows (limitations/ident_power_loss). Medium
\* test tier.
SPECIFICATION Spec
CONSTANTS
    o1 = o1
    o2 = o2
    o3 = o3
    m1 = m1
    m2 = m2
    a = a
    b = b
    Objs = {o1, o2, o3}
    Names = {a, b}
    InitBName <- MCInitBName
    InoOf <- MCInoOf
    GenOf <- MCGenOf
    Boundaries = {}
    Evidence = {"handle_gen"}
    MaxRowId = 3
    StubIds = {}
    MaxMints = 3
    MaxHandles = 2
    MaxCrashes = 1
    MaxPowerLosses = 1
    MaxWipes = 0
    Target = FALSE
    OutOfBand = FALSE
    ProbeByName = FALSE
    ProbeOrder = "handle_first"
    BugSkipVerify = FALSE
    BugGenFromId = FALSE
    BugStubGenFixed = FALSE
    BugRowIdFromMax = FALSE
INVARIANTS
    TypeOK
    OneHandleOneObject
    HeldResolvesToItsObject
    HandlesResolveToTheirObject
    GoneIsStale
    ReuseDetected
    NoBadInode
